name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Assemble calculator
        run: |
          cat src/components/calcb64/p00 \
            src/components/calcb64/p01 \
            src/components/calcb64/p02 \
            src/components/calcb64/p03 \
            src/components/calcb64/p04 \
            src/components/calcb64/p05 \
            src/components/calcb64/p06 \
            src/components/calcb64/p07 \
            src/components/calcb64/p08 \
            src/components/calcb64/p09 \
            src/components/calcb64/p10 \
            src/components/calcb64/p11 \
            src/components/calcb64/p12 \
            src/components/calcb64/p13 \
            src/components/calcb64/p14 \
            src/components/calcb64/p15 | base64 -d > src/components/calculator.tsx
          wc -c src/components/calculator.tsx
      - run: npm run build
      - name: Enable GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/pages" -f build_type=workflow \
            || gh api --method PUT "/repos/${{ github.repository }}/pages" -f build_type=workflow
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
